<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设备状态</title>
<style>
  :root { --accent: #2f7cf6; --line: rgba(0,0,0,.12); --muted: #6b7280; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px 18px 24px; font: 14px/1.6 "Microsoft YaHei", system-ui, sans-serif; color: #1f2328; }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  h1 { font-size: 16px; margin: 0; }
  h2 { font-size: 14px; margin: 22px 0 8px; }
  .muted { color: var(--muted); font-size: 12px; }
  button { font: inherit; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--accent); color: #fff; cursor: pointer; }
  button.ghost { background: #fff; color: inherit; }
  pre { margin: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px;
        background: #fafafa; white-space: pre-wrap; word-break: break-all; font: 12px/1.7 Consolas, monospace; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .shot { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: zoom-in; background: #fafafa; }
  .shot img { display: block; width: 100%; height: 96px; object-fit: cover; }
  .shot span { display: block; padding: 4px 6px; font-size: 11px; color: var(--muted);
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #preview { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: none;
             align-items: center; justify-content: center; padding: 24px; cursor: zoom-out; }
  #preview.on { display: flex; }
  #preview img { max-width: 100%; max-height: 100%; border-radius: 6px; }
</style>
</head>
<body>
  <header>
    <h1>设备状态</h1>
    <span class="muted" id="updated">读取中…</span>
    <button id="refresh">刷新</button>
  </header>

  <pre id="status">读取中…</pre>

  <h2>最近截图 <span class="muted">（在 QQ 里发 /截图、/录屏 后刷新）</span></h2>
  <div class="grid" id="shots"></div>

  <div id="preview"><img alt=""></div>

  <script>
    /* window.lovomo 由主程序在页面加载前注入：asset() 取插件 data 目录里的文件，
     * theme() 拿主程序当前的皮肤主色。没有桥接（比如直接在浏览器打开这个文件）时
     * 退化成同目录相对路径，方便单独调试。 */
    const api = window.lovomo || {
      asset: (name) => '../data/' + name,
      theme: () => ({accent: '#2f7cf6'}),
    };

    function assetUrl(name) {
      const url = api.asset(name);
      return url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
    }

    function esc(text) {
      return String(text).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
    }

    function renderShots(names) {
      const box = document.getElementById('shots');
      if (!names.length) {
        box.innerHTML = '<div class="muted">还没有截图。</div>';
        return;
      }
      box.innerHTML = names.map(name => `
        <div class="shot" data-name="${esc(name)}">
          <img src="${esc(assetUrl('shots/' + name))}" alt="${esc(name)}" loading="lazy">
          <span title="${esc(name)}">${esc(name)}</span>
        </div>`).join('');
      box.querySelectorAll('.shot').forEach(el => {
        el.addEventListener('click', () => {
          const img = document.querySelector('#preview img');
          img.src = assetUrl('shots/' + el.dataset.name);
          document.getElementById('preview').classList.add('on');
        });
      });
    }

    async function load() {
      const statusEl = document.getElementById('status');
      const updatedEl = document.getElementById('updated');
      try {
        const resp = await fetch(assetUrl('status.json'));
        if (!resp.ok) throw new Error('status.json 不存在');
        const data = await resp.json();
        statusEl.textContent = data.status || '（没有状态文本：可能关掉了「回复设备状态」）';
        updatedEl.textContent = data.updated ? `更新于 ${data.updated}` : '';
        renderShots(Array.isArray(data.shots) ? data.shots : []);
      } catch (e) {
        statusEl.textContent = '读不到状态快照。先在 QQ 里发一次 /截图 或 /录屏，再点「刷新」。';
        updatedEl.textContent = '';
        renderShots([]);
      }
    }

    document.getElementById('refresh').addEventListener('click', load);
    document.getElementById('preview').addEventListener('click', () => {
      document.getElementById('preview').classList.remove('on');
    });
    document.documentElement.style.setProperty('--accent', api.theme().accent || '#2f7cf6');
    load();
  </script>
</body>
</html>
